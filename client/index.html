<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bank Sampah Digital - Platform Sirkular Ekonomi</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BankSampah">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css?v=20261111c">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css?v=20261111d">
  <link rel="stylesheet" href="/css/chatbot.css?v=20261028b">
  <link rel="stylesheet" href="/css/integrasi.css?v=20261117">
</head>

<body>

  <!-- 1-Click Quick Demo Role Switcher Bar (Always Available for Rapid Pair-Testing) -->
  <header class="demo-role-bar" id="demo-role-bar">
    <div class="demo-role-info">
      <span class="demo-role-label">⚡ Demo RBAC:</span>
      <span class="demo-role-desc">Uji Coba 4 Peran Instan</span>
    </div>
    <div class="demo-role-buttons">
      <button type="button" class="demo-role-btn" data-role="ADMIN" onclick="quickSwitchRole('ADMIN')">
        <span>💬</span> Admin
      </button>
      <button type="button" class="demo-role-btn" data-role="OWNER" onclick="quickSwitchRole('OWNER')">
        <span>📧</span> Owner / Pengelola
      </button>
      <button type="button" class="demo-role-btn" data-role="PETUGAS" onclick="quickSwitchRole('PETUGAS')">
        <span>⭐</span> Petugas Timbang
      </button>
      <button type="button" class="demo-role-btn" data-role="NASABAH" onclick="quickSwitchRole('NASABAH')">
        <span>💧</span> Nasabah Warga
      </button>
    </div>
  </header>

  <!-- Login Layout (Active when logged out) -->
  <main id="login-layout" style="display: none;"></main>

  <!-- Authenticated Application Shell -->
  <div id="shell-layout" class="shell-layout">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <div style="width: 36px; height: 36px; background: var(--primary-100); color: var(--primary-800); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
          ↗️
        </div>
        <div>
          <div class="sidebar-title">Bank Sampah</div>
          <div class="sidebar-subtitle">Digital & Sirkular</div>
        </div>
      </div>

      <!-- Dynamic Role-Based Navigation Menu -->
      <nav class="sidebar-nav" id="sidebar-menu"></nav>

      <!-- AI Model Switcher Component (Admin Only - rendered by JS) -->
      <div class="sidebar-ai-switcher" id="sidebar-ai-switcher" style="display: none;">
        <div class="ai-switcher-header">
          <div class="ai-switcher-label">
            <span class="ai-switcher-icon">🤖</span>
            <span>Model AI</span>
          </div>
          <span class="ai-switcher-badge" id="ai-model-badge">Gemini</span>
        </div>
        <div class="ai-switcher-select-wrap">
          <select id="ai-model-select" class="ai-switcher-select" onchange="handleAiModelChange(this.value)" aria-label="Pilih Model AI">
            <option value="gemini" selected>Google Gemini 1.5 Pro</option>
            <option value="grok">xAI Grok 2</option>
          </select>
        </div>
      </div>

      <!-- Theme Toggle Button -->
      <div class="sidebar-theme-toggle" id="sidebar-theme-toggle">
        <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Ganti Tema" title="Ganti Tema Gelap/Terang">
          <!-- Sun icon (shown in dark mode) -->
          <svg id="theme-icon-sun" class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg id="theme-icon-moon" class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span id="theme-toggle-label">Mode Gelap</span>
        </button>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button type="button" class="btn btn-secondary btn-sm btn-block" onclick="handleLogout()" style="justify-content: center;">
          🚪 Keluar (Logout)
        </button>
      </div>
    </aside>

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleMobileMenu(true)"></div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
            <span>☰</span>
          </button>
          <h1 class="topbar-title" id="view-title">Dasbor</h1>
        </div>

        <div class="topbar-right">
          <div class="user-profile-summary">
            <div class="user-avatar" id="topbar-user-avatar">U</div>
            <div style="text-align: right; line-height: 1.2;">
              <div style="font-weight: 700; font-size: 0.9rem;" id="topbar-user-name">User</div>
              <span class="role-badge" id="topbar-user-role" style="font-size: 0.7rem;">Peran</span>
            </div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="handleLogout()" title="Keluar">
            Keluar
          </button>
        </div>
      </header>

      <!-- Viewport Content Area -->
      <main class="content-area" id="view-content"></main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (PWA) -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner" id="bottom-nav-inner"></div>
  </nav>

  <!-- Global Modal Dialog Container -->
  <div class="modal-overlay" id="global-modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modal-title-text">Judul Modal</div>
        <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body-content"></div>
      <div class="modal-footer" id="modal-footer-content"></div>
    </div>
  </div>

  <!-- Floating Toast Notifications Container -->
  <div id="toast-container"></div>

  <!-- Application Logic Scripts -->
  <script src="/js/vendor/dompurify.min.js?v=20261028b"></script>
  <script src="/js/api.js?v=20261111f"></script>
  <script src="/js/state.js?v=20261111f"></script>
  <script src="/js/router.js?v=20261111f"></script>
  <script src="/js/app.js?v=20261111f"></script>
  <script src="/js/chatbot.js?v=20261111f"></script>
</body>
</html>
