<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bank Sampah Digital - Platform Sirkular Ekonomi</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BankSampah">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/chatbot.css?v=20261028b">
</head>

<body>

  <!-- 1-Click Quick Demo Role Switcher Bar (Always Available for Rapid Pair-Testing) -->
  <header class="demo-role-bar" id="demo-role-bar">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <span style="font-weight: 700; color: #34d399;">⚡ Demo RBAC:</span>
      <span style="opacity: 0.8; font-size: 0.75rem;">Uji Coba 4 Peran Instan</span>
    </div>
    <div class="demo-role-buttons">
      <button type="button" class="demo-role-btn" data-role="ADMIN" onclick="quickSwitchRole('ADMIN')">
        <span>💬</span> Admin
      </button>
      <button type="button" class="demo-role-btn" data-role="OWNER" onclick="quickSwitchRole('OWNER')">
        <span>📧</span> Owner / Pengelola
      </button>
      <button type="button" class="demo-role-btn" data-role="PETUGAS" onclick="quickSwitchRole('PETUGAS')">
        <span>⭐</span> Petugas Timbang
      </button>
      <button type="button" class="demo-role-btn" data-role="NASABAH" onclick="quickSwitchRole('NASABAH')">
        <span>💧</span> Nasabah Warga
      </button>
    </div>
  </header>

  <!-- Login Layout (Active when logged out) -->
  <main id="login-layout" style="display: none;"></main>

  <!-- Authenticated Application Shell -->
  <div id="shell-layout" style="display: flex; flex: 1;">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <div style="width: 36px; height: 36px; background: var(--primary-100); color: var(--primary-800); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
          ↗️
        </div>
        <div>
          <div class="sidebar-title">Bank Sampah</div>
          <div class="sidebar-subtitle">Digital & Sirkular</div>
        </div>
      </div>

      <!-- Dynamic Role-Based Navigation Menu -->
      <nav class="sidebar-nav" id="sidebar-menu"></nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button type="button" class="btn btn-secondary btn-sm btn-block" onclick="handleLogout()" style="justify-content: center;">
          🚪 Keluar (Logout)
        </button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
            <span>☰</span>
          </button>
          <h1 class="topbar-title" id="view-title">Dasbor</h1>
        </div>

        <div class="topbar-right">
          <button type="button" class="btn btn-secondary btn-sm" onclick="toggleChatbot(true)" style="display: flex; align-items: center; gap: 0.4rem; border: 1px solid var(--primary-400); background: var(--primary-50); color: var(--primary-800); font-weight: 700;" title="Tanya Asisten AI Bank Sampah Digital">
            <span>💬</span> <span>Tanya Asisten AI</span>
          </button>
          <div class="user-profile-summary">
            <div class="user-avatar" id="topbar-user-avatar">U</div>
            <div style="text-align: right; line-height: 1.2;">
              <div style="font-weight: 700; font-size: 0.9rem;" id="topbar-user-name">User</div>
              <span class="role-badge" id="topbar-user-role" style="font-size: 0.7rem;">Peran</span>
            </div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="handleLogout()" title="Keluar">
            Keluar
          </button>
        </div>
      </header>

      <!-- Viewport Content Area -->
      <main class="content-area" id="view-content"></main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (PWA) -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner" id="bottom-nav-inner"></div>
  </nav>

  <!-- Global Modal Dialog Container -->
  <div class="modal-overlay" id="global-modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modal-title-text">Judul Modal</div>
        <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body-content"></div>
      <div class="modal-footer" id="modal-footer-content"></div>
    </div>
  </div>

  <!-- Floating Toast Notifications Container -->
  <div id="toast-container"></div>

  <!-- Application Logic Scripts -->
  <script src="/js/vendor/dompurify.min.js?v=20261028b"></script>
  <script src="/js/api.js?v=20261028b"></script>
  <script src="/js/state.js?v=20261028b"></script>
  <script src="/js/router.js?v=20261028b"></script>
  <script src="/js/app.js?v=20261028b"></script>
  <script src="/js/chatbot.js?v=20261028b"></script>
</body>
</html>
